site_name: Lumina
site_description: Pure-Java, server-driven UI framework for interactive and AI-native apps
site_url: https://wosslabs-lumina.readthedocs.io/
site_author: Woss Labs
repo_url: https://github.com/wosslabs/lumina
repo_name: wosslabs/lumina
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
copyright: Copyright &copy; Lumina contributors — Apache License 2.0

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/wosslabs/lumina

nav:
  - Home: index.md
  - Getting started:
      - Developer guide: DEVELOPER_GUIDE.md
      - AI guide (RAG / Agents / MCP): AI_GUIDE.md
      - Author cheat sheet: GUIDE.md
      - Product overview: PRODUCT.md
  - Concepts:
      - Vision & roadmap: VISION.md
      - Architecture: ARCHITECTURE.md
      - UX constitution: UX_CONSTITUTION.md
  - How-to:
      - Extensions: EXTENSIONS.md
      - Migration to 1.0: MIGRATION.md
      - Releasing: RELEASING.md
      - Benchmarks: BENCHMARKS.md
